services:
  skatapp:
    build: .
    container_name: skatapp
    ports:
      # App listens on port 5000
      - "5002:5000"
    volumes:
      # Ein VERZEICHNIS mounten, nicht die einzelne DB-Datei:
      # Im WAL-Modus legt SQLite zusätzlich "-wal" und "-shm" daneben an.
      - ./data:/app/data
    environment:
      SKAT_DB: /app/data/skat_daten.db
    restart: unless-stopped
